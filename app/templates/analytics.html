{% extends "base.html" %}
{% block title %}Analytics - FraudGuard{% endblock %}
{% block page_title %}Fraud Analytics{% endblock %}
{% block content %}

{% if not ready %}
<div class="card error-state">Model not trained yet.</div>
{% else %}
<div class="grid grid-2">
  <div class="card"><div id="riskDistChart"></div></div>
  <div class="card"><div id="perfChart"></div></div>
</div>
{% endif %}
{% endblock %}

{% block scripts %}
{% if ready %}
<script>
const riskDist = {{ summary.risk_distribution | tojson }};
const labels = Object.keys(riskDist).map(riskLabel);
Plotly.newPlot('riskDistChart', [{
  type: 'pie', labels: labels, values: Object.values(riskDist), hole: 0.45,
}], { title: 'Risk Level Distribution (logged predictions)' }, {responsive: true});

const metrics = {{ summary.model_metrics | tojson }};
Plotly.newPlot('perfChart', [{
  type: 'bar',
  x: ['Precision', 'Recall', 'F1', 'ROC-AUC', 'PR-AUC'],
  y: [metrics.precision, metrics.recall, metrics.f1, metrics.roc_auc, metrics.pr_auc],
  marker: { color: '#2563EB' }
}], { title: 'Model Performance (test set)', yaxis: {range: [0,1]} }, {responsive: true});
</script>
{% endif %}
{% endblock %}
